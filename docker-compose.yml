services:
  postgres:
    image: postgres:16-alpine
    container_name: ezsplit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezsplit
      POSTGRES_USER: ezsplit
      POSTGRES_PASSWORD: ezsplit
    ports:
      - "5432:5432"
    volumes:
      - ezsplit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezsplit -d ezsplit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ezsplit-pgdata: